<title>Pandit Ji – Talk to an astrologer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#FBEDE4; --muted:#BBA3AE; --orange:#FA6E1E; --orange-dark:#E25A0C;
  --page:#120810; --tile:#22121D; --line:#3D2333;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 50% at 50% 0%,#2E1424 0%,var(--page) 70%) no-repeat,var(--page);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;justify-content:center;padding:8px 0 20px}
header img{width:min(260px,70%);height:auto;display:block}
.list{display:flex;flex-direction:column;gap:14px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:16px}
.top{display:flex;align-items:center;gap:14px}
.avatar{flex:none;width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--orange);background:var(--line)}
.info{min-width:0}
h2{margin:0;font-size:18px;font-weight:600;line-height:1.25}
.info p{margin:4px 0 0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.cta{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;margin-top:14px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--orange);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer;transition:background .15s,transform .1s}
.cta:hover{background:var(--orange-dark)}
.cta:active{transform:scale(.98)}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
